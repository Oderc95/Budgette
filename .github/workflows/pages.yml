# Vérifie chaque proposition de modification, et publie `main` sur GitHub Pages.
# Le routage utilise HashRouter et `base: './'`, donc aucune réécriture d'URL
# n'est nécessaire côté hébergeur : les fichiers statiques suffisent.
name: Vérifications et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Autorise l'action de déploiement à publier sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Une PR qui reçoit plusieurs pushs n'en vérifie que le dernier ; sur `main`,
# les déploiements se suivent sans s'annuler pour ne pas laisser le site
# publié dans un état intermédiaire.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vérifications
        run: |
          npm run lint
          npm run typecheck

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Les PR s'arrêtent après les vérifications : seule `main` est publiée.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
