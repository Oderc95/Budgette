<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!--
    Marque de Budgette. Les couleurs sont écrites en dur : une favicon est
    chargée hors du document, où les variables de thème n'existent pas.
    Ce sont les valeurs du thème clair, lisibles sur les deux fonds d'onglet.
  -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#db5620"/>
      <stop offset="1" stop-color="#d0344f"/>
    </linearGradient>
    <linearGradient id="reflet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="13" fill="url(#fond)"/>
  <rect width="48" height="48" rx="13" fill="url(#reflet)"/>

  <path d="M24 38 C 23.4 30, 23.7 23, 24 16.5" fill="none" stroke="#fffaf5" stroke-width="3.1" stroke-linecap="round"/>
  <path d="M22.9 26 C 16.2 26.2, 11.7 22.2, 11.5 15.5 C 18.2 15.7, 22.6 19.4, 22.9 26 Z" fill="#fffaf5"/>
  <path d="M25.1 20.6 C 31.8 20.8, 36.3 16.6, 36.5 10 C 29.8 10.2, 25.4 14, 25.1 20.6 Z" fill="#fffaf5" opacity="0.86"/>
</svg>
