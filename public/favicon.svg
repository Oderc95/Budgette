<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!--
    Marque de Budgette. Les couleurs sont écrites en dur : une favicon est
    chargée hors du document, où les variables de thème n'existent pas.
    Ce sont les valeurs du thème clair, lisibles sur les deux fonds d'onglet.
  -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#db5620"/>
      <stop offset="1" stop-color="#d0344f"/>
    </linearGradient>
    <linearGradient id="reflet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="13" fill="url(#fond)"/>
  <rect width="48" height="48" rx="13" fill="url(#reflet)"/>

  <circle cx="24" cy="32.6" r="6.4" fill="none" stroke="#fffaf5" stroke-width="2.4" opacity="0.55"/>
  <path d="M24 26.4 C 23.5 22, 23.7 19, 24 15.4" fill="none" stroke="#fffaf5" stroke-width="2.9" stroke-linecap="round"/>
  <path d="M23.2 22.4 C 17.6 22.6, 13.8 19.2, 13.6 13.6 C 19.2 13.8, 22.9 17.2, 23.2 22.4 Z" fill="#fffaf5"/>
  <path d="M24.8 18 C 30.4 18.2, 34.2 14.8, 34.4 9.2 C 28.8 9.4, 25.1 12.8, 24.8 18 Z" fill="#fffaf5" opacity="0.86"/>
</svg>
